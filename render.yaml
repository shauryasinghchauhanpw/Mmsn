# Render blueprint — $0 DEMO deployment (see DEPLOYMENT.md "Option B").
#
# HONEST LIMITS — read before you use this:
# - The free backend has 512 MB RAM and no persistent disk. It boots and
#   serves the site, but it CANNOT run Whisper transcription on real videos
#   (Whisper `tiny` alone wants ~1 GB) — processing jobs will run out of
#   memory. Keep test videos under ~30 seconds, and expect failures.
# - Free services sleep after 15 idle minutes (~1 min wake) and all files
#   + the SQLite database are LOST on every restart/sleep/redeploy.
# - There is deliberately NO managed Postgres here: Render's free Postgres
#   expires after 30 days and is then deleted. For data that survives,
#   paste a free Neon Postgres URL into DATABASE_URL instead
#   (0.5 GB, 100 CU-hours/mo, no card, no expiry — see DEPLOYMENT.md).
# - The recommended $0 path that CAN actually process videos is
#   Option A in DEPLOYMENT.md: Oracle Always Free VM + Vercel frontend
#   (see docker-compose.yml). This blueprint exists only so the app can
#   be tried on Render for $0.
services:
  - type: web
    name: mmsn-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    # ^ $0. Do NOT change this to a paid plan here — paid upgrades are
    # documented separately in DEPLOYMENT.md ("What paid buys").
    envVars:
      # Leave blank = SQLite in the container (lost on restart — see
      # above). Paste a Neon free Postgres URL here to keep accounts
      # and projects between restarts.
      - key: DATABASE_URL
        sync: false
      # REQUIRED (Phase 2): JWT signing secret. Render generates a
      # random value on first apply — do not put a real secret in the repo.
      # The backend refuses to start without a secret of >= 32 chars.
      - key: SECRET_KEY
        generateValue: true
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: CLIPS_PER_PROJECT
        value: "3"
      # Demo guardrails for a 512 MB instance: short videos only.
      # Processing a long video here will run out of memory.
      - key: MAX_VIDEO_SECONDS
        value: "300"
      - key: MAX_UPLOAD_MB
        value: "256"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://mmsn-frontend.onrender.com
    healthCheckPath: /health
    # NOTE: no `disk:` — free Render services cannot attach a disk.

  - type: web
    name: mmsn-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://mmsn-backend.onrender.com

# No databases: block here on purpose — Render's free Postgres expires
# after 30 days. Use Neon free (see DATABASE_URL above) or the Oracle
# VM path (Postgres in docker-compose.yml) instead.
#
# No Redis/Celery worker service here either: background workers have no
# free instance type on Render, and setting CELERY_BROKER_URL/REDIS_URL
# without a worker would queue jobs no worker ever runs. Jobs run
# in-process in the backend (default) and are marked failed — not
# silently re-run — if the backend restarts.
